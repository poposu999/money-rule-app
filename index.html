<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家計簿</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <header>
    <h1>家計簿 <span class="app-version">v12</span></h1>
    <p>収入・固定費・貯金を先に整理して、今月使える金額を自動計算。</p>
  </header>
  <section class="card quick-entry" data-section-content="quick-entry">
    <div class="section-title"><h2>支出を記録</h2><button class="minus-btn" data-section="quick-entry">−</button></div>
    <div class="grid">
      <label>金額
        <input id="expenseAmount" type="number" min="0" step="100" inputmode="numeric" placeholder="1500">
      </label>
      <label>カテゴリ
        <select id="expenseCategory">
          <option>食費</option><option>日用品</option><option>交通費</option>
          <option>娯楽</option><option>外食</option><option>その他</option>
        </select>
      </label>
      <label>メモ
        <input id="expenseMemo" type="text" placeholder="昼ごはん">
      </label>
      <label>日付
        <input id="expenseDate" type="date">
      </label>
    </div>
    <button id="addExpense">支出を追加</button>
  </section>
<section class="card" data-section-content="expense-list">
    <div class="section-title expense-section-title"><h2>今月の支出</h2><div class="section-title-actions"><strong id="expenseTotal" class="expense-total">合計：¥0</strong><button class="minus-btn" data-section="expense-list">−</button></div></div>
    <div id="expenseList" class="expense-table-wrap"></div>
  </section>
  <section class="stats" data-section-content="stats">
    <div class="section-title full"><h2>今月の状況</h2><button class="minus-btn" data-section="stats">−</button></div>
    <div class="stat highlight"><span>今月の残り予算</span><strong id="remainingBudget">¥0</strong></div>
    <div class="stat"><span>1日あたりの目安</span><strong id="dailyBudget">¥0</strong></div>
    <div class="stat"><span>今月使った金額</span><strong id="monthSpent">¥0</strong></div>
    <div class="stat"><span>今月の支出件数</span><strong id="expenseCount">0件</strong></div>
    <div class="stat" id="incomeStat"><span>今月の収入</span><strong id="incomeView">¥0</strong><button type="button" class="stat-toggle-btn" data-stat="income" title="非表示にする">−</button></div>
    <div class="stat" id="extraIncomeStat"><span>毎月の最低限の手取りからの超過分</span><strong id="extraIncome">¥0</strong></div>
    <div class="stat"><span>今月の貯金予定</span><strong id="plannedSavings">¥0</strong></div>
    <div class="stat"><span>今月使える予算</span><strong id="spendingBudget">¥0</strong></div>
  </section>
  <div id="incomeRestore" class="income-restore hidden"><button type="button" class="secondary-btn">今月の収入を表示</button></div>
  <section class="card" data-section-content="progress">
    <div class="section-title"><h2>今月の支出ペース</h2><button class="minus-btn" data-section="progress">−</button></div>
    <div class="progress-wrap">
      <div class="progress-label"><span>予算</span><strong id="budgetProgressText">¥0 / ¥0</strong></div>
      <div class="progress"><div id="budgetProgressBar"></div></div>
      <div class="progress-sub"><span id="budgetProgressPercent">0%</span><span id="budgetStatus">データを入力すると表示されます</span></div>
    </div>
  </section> <section class="charts" data-section-content="charts">
    <div class="section-title full"><h2>グラフ</h2><button class="minus-btn" data-section="charts">−</button></div>
    <div class="card chart-card">
      <h2>カテゴリ別の支出</h2>
      <div id="categoryChart" class="donut-chart"></div>
      <div id="categoryLegend" class="legend"></div>
    </div>

    <div class="card chart-card">
      <h2>日ごとの支出推移</h2>
      <div class="line-chart-wrap">
        <svg id="dailyChart" viewBox="0 0 700 260" role="img" aria-label="日ごとの支出推移"></svg>
      </div>
      <div id="dailyChartSummary" class="chart-summary"></div>
    </div>

    <div class="card chart-card">
      <h2>月別の支出推移</h2>
      <div class="line-chart-wrap">
        <svg id="monthlyChart" viewBox="0 0 700 260" role="img" aria-label="月別の支出推移"></svg>
      </div>
      <div id="monthlyChartSummary" class="chart-summary"></div>
    </div>

    <div class="card chart-card">
      <h2>月別の貯金額</h2>
      <div class="bar-chart-wrap">
        <svg id="savingsChart" viewBox="0 0 700 260" role="img" aria-label="月別の貯金額"></svg>
      </div>
      <div id="savingsChartSummary" class="chart-summary"></div>
    </div>
  </section> <section class="card" data-section-content="income">
    <div class="section-title"><h2>今月の収入</h2><button class="minus-btn" data-section="income">−</button></div>
    <label>前月の収入
      <input id="income" type="number" min="0" step="1000" inputmode="numeric" placeholder="300000">
    </label>
    <label>ボーナス額
      <input id="bonus" type="number" min="0" step="1000" inputmode="numeric" placeholder="0">
    </label>
    <button id="saveIncome">収入を保存</button>
  </section> <section class="card" data-section-content="settings">
    <div class="section-title"><h2>家計ルール</h2><button class="minus-btn" data-section="settings">−</button></div>
    <div class="grid">
      <label>毎月の最低限の手取り
        <input id="minimumTakeHome" type="number" min="0" step="1000" inputmode="numeric" placeholder="250000">
      </label>
      <label>毎月の固定費
        <input id="fixedCosts" type="number" min="0" step="1000" inputmode="numeric" placeholder="150000">
      </label>
      <label>毎月の貯金目標
        <input id="savingsTarget" type="number" min="0" step="1000" inputmode="numeric" placeholder="50000">
      </label>
      <label>超過分のお小遣い割合（%）
        <input id="extraAllowancePercent" type="number" min="0" max="100" step="1" value="50">
      </label>
      <label>超過分の貯金割合（%）
        <input id="extraSavingsPercent" type="number" min="0" max="100" step="1" value="50">
      </label>
    </div>
    <button id="saveSettings">ルールを保存</button>
  </section>
  <div id="editModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header"><h2>支出を編集</h2><button id="closeModal" class="close-btn">×</button></div>
      <label>金額<input id="editAmount" type="number" min="0" step="100" inputmode="numeric"></label>
      <label>カテゴリ
        <select id="editCategory">
          <option>食費</option><option>日用品</option><option>交通費</option>
          <option>娯楽</option><option>外食</option><option>その他</option>
        </select>
      </label>
      <label>メモ<input id="editMemo" type="text"></label>
      <label>日付<input id="editDate" type="date"></label>
      <div class="modal-actions"><button id="cancelEdit" class="secondary-btn">キャンセル</button><button id="saveEdit">変更を保存</button></div>
    </div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
