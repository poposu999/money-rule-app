name: Ver.48 production release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-ver48.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch validated source
        run: |
          git clone --depth 1 --branch develop https://github.com/poposu999/money-rule-app-dev.git /tmp/money-rule-app-dev
          test "$(git -C /tmp/money-rule-app-dev rev-parse HEAD)" = "d7d8f6efe417d8a395c525250ed99bcef9104613"

      - name: Build Ver.48 production files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          src=Path('/tmp/money-rule-app-dev')
          dst=Path('.')
          files=['README.md','app.js','index.html','manifest.json','style.css','sw.js']
          for name in files:
              shutil.copyfile(src/name,dst/name)

          for name in ['app.js','index.html','sw.js']:
              p=dst/name
              text=p.read_text(encoding='utf-8')
              if '47.95' not in text:
                  raise SystemExit(f'expected 47.95 in {name}')
              p.write_text(text.replace('47.95','48'),encoding='utf-8')

          (dst/'README.md').write_text('''# 家計簿アプリ\n\n## ver.48\n- Ver.47.95までの検証内容を正式版として本番反映\n- 支出・予定支出・固定費の登録、編集、削除フローを整理\n- ダッシュボードの残り予算・1日あたり目安・支出ペース表示を改善\n- 支出ペースのToday表示を現在日に追従するよう修正\n- 固定費の新規カテゴリは未選択から開始し、選択必須に変更\n- 月別の貯金額グラフを削除し、グラフ構成を整理\n- 日付またぎ・アプリ復帰時に現在日付へ追従する処理を追加\n- 金額入力は数字入力に統一し、計算式入力機能を廃止\n- 保存キー moneyRuleAppV2 と既存データ構造は維持\n- index.html / app.js / sw.js / キャッシュ指定 / アプリ下部のバージョンを ver.48 に統一\n''',encoding='utf-8')
          PY

      - name: Validate release
        run: |
          node --check app.js
          node --check sw.js
          git diff --check
          grep -n 'const VERSION="48"' app.js
          grep -n 'moneyRuleAppV2' app.js
          grep -n 'money-rule-app-v48' sw.js
          grep -n 'todayLabel.className=`today-label' app.js
          ! grep -R -n '47\.95' README.md app.js index.html manifest.json style.css sw.js
          ! grep -n 'calculateAmountExpression\|bindAmountCalculator' app.js

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/release-ver48.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Validate final tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected={'README.md','app.js','index.html','manifest.json','style.css','sw.js'}
          actual={p.name for p in Path('.').iterdir() if p.name != '.git'}
          if actual != expected:
              raise SystemExit(f'final top-level tree mismatch: {sorted(actual)}')
          PY
          node --check app.js
          node --check sw.js
          git diff --check

      - name: Commit Ver.48
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ver.48: production release'
          git push origin main
